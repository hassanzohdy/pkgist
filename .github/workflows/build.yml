name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel any in-flight runs for the same branch/PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest]
        # Also smoke-test on Windows so path/CRLF regressions in the build
        # output are caught before they ship.
        include:
          - node: 20
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` refuses to run against a lockfile that does not match
      # package.json. Adding a dependency without refreshing package-lock.json
      # fails here — and inside the parent yarn workspace a plain
      # `npm install --package-lock-only` silently reports "up to date" without
      # writing the entry. Refresh with:
      #   npm install <pkg> --save-dev --package-lock-only --workspaces=false
      - name: Install dependencies
        run: npm ci

      # Release-integrity logic (retry classification, the registry
      # PRESENT/ABSENT/COULD-NOT-ASK decision table, per-phase run reporting)
      # is unit-tested. These guard behaviour that only shows up mid-release,
      # where a regression is expensive and hard to spot.
      - name: Test
        run: npm test

      # Compile smoke-test — catches build breaks (tsup) on every push and PR.
      - name: Build
        run: npm run build
