name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel any in-flight runs for the same branch/PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest]
        # Also smoke-test on Windows so path/CRLF regressions in the build
        # output are caught before they ship.
        include:
          - node: 22
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # `--frozen-lockfile` refuses to run against a pnpm-lock.yaml that does not
      # match package.json, so adding a dependency without refreshing the lockfile
      # fails here. This repo keeps its own standalone lockfile; refresh it from
      # inside the @mongez workspace with:
      #   pnpm install --lockfile-only --ignore-workspace
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Release-integrity logic (retry classification, the registry
      # PRESENT/ABSENT/COULD-NOT-ASK decision table, per-phase run reporting)
      # is unit-tested. These guard behaviour that only shows up mid-release,
      # where a regression is expensive and hard to spot.
      - name: Test
        run: pnpm test

      # Compile smoke-test — catches build breaks (tsdown) on every push and PR.
      - name: Build
        run: pnpm build
